# AI-SRM bản Local — cài trên máy chủ của trường, dữ liệu lưu tại trường, chạy được không cần Internet.
# Cấu hình trong tệp .env (tạo bởi cai-dat.ps1 / cai-dat.sh từ .env.example).
name: aisrm

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: aisrm
      POSTGRES_USER: aisrm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Chưa đặt POSTGRES_PASSWORD trong .env}
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U aisrm -d aisrm']
      interval: 5s
      timeout: 5s
      retries: 30

  api:
    image: aisrm-api:${AISRM_VERSION:-1.0}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DEPLOY_TARGET: local
      APP_ENV: production
      DATABASE_URL: postgres://aisrm:${POSTGRES_PASSWORD}@db:5432/aisrm
      FILE_STORAGE_DIR: /data/files
      LOCAL_SECRET_KEY: ${LOCAL_SECRET_KEY:?Chưa đặt LOCAL_SECRET_KEY trong .env}
      LOCAL_AI_BASE_URL: ${LOCAL_AI_BASE_URL:-}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      DEFAULT_TIMEZONE: Asia/Ho_Chi_Minh
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - files:/data/files
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:8080/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 30

  web:
    image: aisrm-web:${AISRM_VERSION:-1.0}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '${HTTP_PORT:-80}:80'

  # Máy chủ AI nội bộ (tùy chọn): docker compose --profile ai up -d
  # Cần GPU NVIDIA + NVIDIA Container Toolkit; tải model lần đầu cần Internet (xem HUONG_DAN_CAI_DAT).
  ollama:
    image: ollama/ollama:latest
    profiles: ['ai']
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  db:
  files:
  ollama:
