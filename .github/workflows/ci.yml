name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:shared
      - run: pnpm typecheck
      - name: Unit tests (phân quyền, workflow, kiểm tra hồ sơ)
        run: pnpm --filter @aisrm/shared test
      - run: pnpm --filter @aisrm/web build
      - run: npm install -g firebase-tools@15
      - name: Integration tests (Firebase Emulator)
        run: pnpm test:integration
      - name: E2E (Playwright + Chrome + Emulator)
        run: firebase emulators:exec --project demo-aisrm --only auth,firestore,storage "pnpm seed && pnpm exec playwright test"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
