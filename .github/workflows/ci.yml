name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:shared
      - run: pnpm typecheck
      - name: Unit tests (phân quyền, workflow, kiểm tra hồ sơ)
        run: pnpm --filter @aisrm/shared test
      - run: pnpm --filter @aisrm/web build
      - run: npm install -g firebase-tools@15
      - name: Integration tests (Firebase Emulator)
        run: pnpm test:integration
      - name: E2E (Playwright + Chrome + Emulator)
        run: firebase emulators:exec --project demo-aisrm --only auth,firestore,storage "pnpm seed && pnpm exec playwright test"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Bản Local (ADR-0003): cùng bộ test tích hợp + E2E, dữ liệu trên PostgreSQL, đăng nhập nội bộ.
  # Tệp vẫn dùng Storage emulator cho đến L4.
  integration-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: aisrm
          POSTGRES_PASSWORD: aisrm_ci
          POSTGRES_DB: aisrm_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U aisrm" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATA_BACKEND: postgres
      IDENTITY_BACKEND: local
      DATABASE_URL: postgres://aisrm:aisrm_ci@127.0.0.1:5432/aisrm_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:shared
      - run: npm install -g firebase-tools@15
      - name: Integration tests (PostgreSQL + đăng nhập nội bộ)
        run: pnpm test:integration:pg
      - run: pnpm --filter @aisrm/web build
      - name: E2E bản Local (PostgreSQL + đăng nhập nội bộ)
        run: firebase emulators:exec --project demo-aisrm --only auth,storage "pnpm seed && pnpm exec playwright test"
